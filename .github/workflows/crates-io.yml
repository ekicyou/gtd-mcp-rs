name: crates-io

run-name: crates-io ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 出す版（v を付けない。例 0.8.4）
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: crates-io
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
    - name: 版の形
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
          pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          value="$INPUT_VERSION"
        else
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          value="$REF_NAME"
        fi
        if [[ ! "$value" =~ $pattern ]]; then
          echo "::error::版の形が外れている。受け付ける形: ${pattern} 受け取った値: $(jq -cn --arg v "$value" '$v')"
          exit 1
        fi
        echo "VERSION=${value#v}" >> "$GITHUB_ENV"

    - name: タグの確かめ
      if: github.event_name == 'workflow_dispatch'
      run: |
        if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${VERSION}" > /dev/null; then
          echo "::error::タグ v${VERSION} が無い"
          exit 1
        fi

    - name: 取り出し
      uses: actions/checkout@v5
      with:
        ref: refs/tags/v${{ env.VERSION }}
        persist-credentials: false

    - name: 版の一致
      run: |
        rustup update stable --no-self-update
        actual="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
        if [[ "$actual" != "$VERSION" ]]; then
          echo "::error::版が一致しない。Cargo.toml の版: ${actual} タグ（または入力）の版: ${VERSION}"
          exit 1
        fi
